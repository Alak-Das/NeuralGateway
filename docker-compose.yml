services:
  neural-gateway:
    container_name:  NeuralGateway-App
    build: .
    ports:
    - "127.0.0.1:9090:8080"
    environment:
    - NVIDIA_API_KEY_1=${NVIDIA_API_KEY_1}
    - NVIDIA_API_KEY_2=${NVIDIA_API_KEY_2}
    - NVIDIA_API_KEY_3=${NVIDIA_API_KEY_3}
    - EXPLABS_API_KEY=${EXPLABS_API_KEY}
    - ANTSEED_API_KEY=${ANTSEED_API_KEY}
    - REDIS_HOST=redis
    - LLM_HEALTH_CHECK_ENABLED=${LLM_HEALTH_CHECK_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - gateway
  redis:
    image: redis:7-alpine
    container_name: NeuralGateway-Redis
    command: redis-server --stop-writes-on-bgsave-error no --save 60 1
    volumes:
    - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
    - gateway
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: NeuralGateway-WebUI
    ports:
    - 3000:8080
    environment:
      OPENAI_API_BASE_URL: http://neural-gateway:8080/v1
      OPENAI_API_KEY: neural-gateway-key
      WEBUI_AUTH: 'False'
    depends_on:
    - neural-gateway
    networks:
    - gateway
    volumes:
    - ./open-webui-data:/app/backend/data

networks:
  gateway:
    driver: bridge
