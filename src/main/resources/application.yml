server:
  port: 8080
logging:
  level:
    com.alak.neuralgateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %5p %-40.40logger{39} : [%X{requester:-System} | %X{txId:-NoTx}] %m%n"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
spring:
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
resilience4j.retry:
  instances:
    nvidiaApi:
      maxAttempts: 3
      waitDuration: 500ms
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2
llm:
  health-check:
    intervalMs: 240000
    lock-at-most-for: 5m
    # Some models (e.g. explabs gpt-6-luna) reject max_tokens < 16, which failed
    # every health-check probe. Use 16 tokens so those probes can succeed.
    ping-max-tokens: 16
    enabled: ${LLM_HEALTH_CHECK_ENABLED:false}
  logging:
    payload-mode: ${LLM_LOGGING_PAYLOAD_MODE:NONE}
    preview-max-chars: ${LLM_LOGGING_PREVIEW_MAX_CHARS:120}
  data-retention:
    ttl-hours: ${LLM_DATA_RETENTION_TTL_HOURS:24}
    cleanup-interval-minutes: ${LLM_DATA_RETENTION_CLEANUP_INTERVAL_MINUTES:60}
  providers:
    nvidia:
      base-url: https://integrate.api.nvidia.com/v1
      rate-limit-rpm: 40
      health-check-interval-ms: 1800000
      health-check-max-backoff-ms: 3600000
      overload-cooldown-ms: 300000
      keys:
        - ${NVIDIA_API_KEY_1:}
        - ${NVIDIA_API_KEY_2:}
        - ${NVIDIA_API_KEY_3:}
      models:
        - { id: "moonshotai/kimi-k3",                             priority: 10,  pipelines: [ REASONING, CODING, VISION ] }
        - { id: "z-ai/glm-5.3",                                   priority: 9,   pipelines: [ REASONING, CODING ] }
        - { id: "nvidia/nemotron-3-ultra-550b-a55b",              priority: 9,   pipelines: [ REASONING, CODING ] }
        - { id: "deepseek-ai/deepseek-v4.1-flash",                priority: 8,   pipelines: [ REASONING, CODING, VISION ] }
        - { id: "nvidia/nemotron-3-super-120b-a12b",               priority: 7,   pipelines: [ REASONING, CODING ] }
        - { id: "z-ai/glm-5.3-flash",                             priority: 6,   pipelines: [ REASONING, CODING, VISION ] }
        - { id: "meta/llama-3.2-11b-vision-instruct",             priority: 3,   pipelines: [ VISION ] }
    explabs:
      base-url: https://api.experientiallabs.ai/v1
      rate-limit-rpm: 300
      health-check-interval-ms: 21600000
      health-check-max-backoff-ms: 3600000
      overload-cooldown-ms: 300000
      # explabs rejects max_tokens < 16; enforce this floor on real routed requests too.
      min-max-tokens: 16
      keys:
        - ${EXPLABS_API_KEY:}
      models:
        - { id: "mimo-v2.6-pro",                                  priority: 10,   pipelines: [ REASONING, CODING, VISION ] }
        - { id: "gpt-6-luna",                                     priority: 9,   pipelines: [ REASONING, CODING, VISION ] }
    antseed:
      base-url: http://host.docker.internal:8377/v1
      rate-limit-rpm: 300
      health-check-interval-ms: 21600000
      health-check-max-backoff-ms: 3600000
      overload-cooldown-ms: 300000
      # AntSeed is a peer-to-peer aggregator that echoes provider-qualified canonical IDs
      # (e.g. "openai/gpt-oss-120b") in completion responses; relax exact model-ID matching.
      allow-qualified-model-ids: true
      keys:
        - ${ANTSEED_API_KEY:}
      models:
        - { id: "deepseek-v4-flash",                              priority: 7,   pipelines: [ REASONING, CODING ] }
        - { id: "zai-org/GLM-5.3-Flash",                          priority: 6,   pipelines: [ REASONING, CODING ] }
        - { id: "openai/gpt-oss-120b",                            priority: 6,   pipelines: [ REASONING, CODING ] }
        - { id: "Qwen/Qwen3-235B-A22B-Instruct-2507",             priority: 6,   pipelines: [ REASONING, CODING ] }
