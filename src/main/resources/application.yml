server:
  port: 8080
logging:
  level:
    com.alak.neuralgateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %5p %-40.40logger{39} : [%X{requester:-System} | %X{txId:-NoTx}] %m%n"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
spring:
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ""
      port: 6379
resilience4j.retry:
  instances:
    nvidiaApi:
      maxAttempts: 3
      waitDuration: 500ms
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2
llm:
  logging:
    payload-mode: ${LLM_LOGGING_PAYLOAD_MODE:SUMMARY}
    preview-max-chars: ${LLM_LOGGING_PREVIEW_MAX_CHARS:120}
  providers:
    nvidia:
      base-url: https://integrate.api.nvidia.com/v1
      rate-limit-rpm: 40
      keys:
        - ${NVIDIA_API_KEY_1:}
        - ${NVIDIA_API_KEY_2:}
        - ${NVIDIA_API_KEY_3:}
      models:
        - { id: "nvidia/nemotron-3-super-120b-a12b", priority: 10, pipelines: [REASONING, CODING] }
        - { id: "nvidia/nemotron-3-ultra-550b-a55b", priority: 9,  pipelines: [REASONING, CODING] }
        - { id: "moonshotai/kimi-k3",                 priority: 8,  pipelines: [REASONING, CODING] }
        - { id: "z-ai/glm-5.3",                       priority: 7,  pipelines: [REASONING, CODING] }
        - { id: "poolside/laguna-xs-2.1",             priority: 7,  pipelines: [CODING] }
        - { id: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning", priority: 6, pipelines: [REASONING] }
        - { id: "google/gemma-4-31b-it",              priority: 6,  pipelines: [REASONING, CODING] }
        - { id: "mistralai/mistral-nemotron",         priority: 6,  pipelines: [CODING] }
        - { id: "z-ai/glm-5.3-flash",                 priority: 5,  pipelines: [REASONING, CODING] }
        - { id: "deepseek-ai/deepseek-v4.1-flash",    priority: 5,  pipelines: [REASONING] }
        - { id: "meta/llama-3.2-11b-vision-instruct", priority: 3,  pipelines: [VISION] }
