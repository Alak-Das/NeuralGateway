server:
  port: 8080
logging:
  level:
    com.alak.neuralgateway: DEBUG
    com.alak.neuralgateway.service.HealthCheckService: INFO
    com.alak.neuralgateway.service.ModelStatusService: INFO
    com.alak.neuralgateway.service.RedisPersistenceService: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %5p %-40.40logger{39} : [%X{requester:-System} | %X{txId:-NoTx}] %m%n"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
spring:
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
llm:
  health-check:
    # Main sweep cadence. Each sweep probes every enabled model of every provider
    # whose probe gate has elapsed (circuit-blocked models first), so 120s keeps the
    # NVIDIA fleet fresh roughly every 2 min while staying well under its 40 rpm
    # limit. antseed/explabs are gated by their own per-provider
    # health-check-interval-ms (6h).
    intervalMs: 60005
    lock-at-most-for: 5m
    # Cap on how many models of one provider a single sweep may probe, so a large
    # fleet cannot make one sweep run for minutes (blocked models always fit first).
    max-models-per-sweep: 16
    # Some models (e.g. explabs gpt-6-luna) reject max_tokens < 16, which failed
    # every health-check probe. Use 16 tokens so those probes can succeed.
    ping-max-tokens: 16
    # Health checks are ON by default: without them, models that go down are never
    # re-probed, so the dashboard keeps showing stale statuses and stale OPEN circuits
    # forever. Set LLM_HEALTH_CHECK_ENABLED=false to opt out.
    enabled: ${LLM_HEALTH_CHECK_ENABLED:true}
  logging:
    payload-mode: ${LLM_LOGGING_PAYLOAD_MODE:NONE}
    preview-max-chars: ${LLM_LOGGING_PREVIEW_MAX_CHARS:120}
  data-retention:
    ttl-hours: ${LLM_DATA_RETENTION_TTL_HOURS:24}
    cleanup-interval-minutes: ${LLM_DATA_RETENTION_CLEANUP_INTERVAL_MINUTES:60}
  providers:
    nvidia:
      base-url: https://integrate.api.nvidia.com/v1
      rate-limit-rpm: 40
      # NVIDIA freshness: every enabled model is probed at least every 2 min (the
      # main sweep probes all models of a due provider in one pass, blocked models
      # first) and the exponential overload backoff is capped at 10 min so down
      # models are re-probed quickly instead of waiting up to an hour.
      health-check-interval-ms: 120000
      health-check-max-backoff-ms: 600000
      overload-cooldown-ms: 300000
      keys:
        - ${NVIDIA_API_KEY_1:}
        - ${NVIDIA_API_KEY_2:}
        - ${NVIDIA_API_KEY_3:}
      models:
        - { id: "moonshotai/kimi-k3",                             enabled: true, priority: 10,  pipelines: [ CODING, REASONING, VISION ], timeoutMs: 180000 }
        - { id: "z-ai/glm-5.3",                                   enabled: true, priority: 9,   pipelines: [ CODING, REASONING, VISION ], timeoutMs: 150000 }
        - { id: "nvidia/nemotron-3-ultra-550b-a55b",              enabled: true, priority: 9,   pipelines: [ CODING, REASONING, VISION ] }
        - { id: "deepseek-ai/deepseek-v4.1-flash",                enabled: true, priority: 8,   pipelines: [ CODING, REASONING, VISION ], timeoutMs: 150000 }
        - { id: "nvidia/nemotron-3-super-120b-a12b",              enabled: true, priority: 7,  pipelines: [ CODING, REASONING ] }
        - { id: "z-ai/glm-5.3-flash",                             enabled: true, priority: 6,   pipelines: [ CODING, REASONING, VISION ] }
        - { id: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning",  enabled: true, priority: 6,   pipelines: [ VISION ] }
        - { id: "meta/llama-3.2-90b-vision-instruct",             enabled: true, priority: 6,   pipelines: [ VISION ] }
    explabs:
      base-url: https://api.experientiallabs.ai/v1
      rate-limit-rpm: 300
      health-check-interval-ms: 21600000
      health-check-max-backoff-ms: 3600000
      overload-cooldown-ms: 300000
      # explabs rejects max_tokens < 16; enforce this floor on real routed requests too.
      min-max-tokens: 16
      keys:
        - ${EXPLABS_API_KEY:}
      models:
        - { id: "mimo-v2.6-pro",                                  enabled: false, priority: 10,   pipelines: [ REASONING, CODING ] }
        - { id: "gpt-6-luna",                                     enabled: false, priority: 9,    pipelines: [ REASONING, VISION ] }
        - { id: "glm-5.3-flash-abliterated",                      enabled: true, priority: 6,     pipelines: [ REASONING, VISION ] }
    antseed:
      base-url: http://host.docker.internal:8377/v1
      rate-limit-rpm: 300
      health-check-interval-ms: 21600000
      health-check-max-backoff-ms: 3600000
      overload-cooldown-ms: 300000
      # AntSeed is a peer-to-peer aggregator that echoes provider-qualified canonical IDs
      # (e.g. "openai/gpt-oss-120b") in completion responses; relax exact model-ID matching.
      allow-qualified-model-ids: true
      keys:
        - ${ANTSEED_API_KEY:}
      models:
        - { id: "antseed",                                        enabled: true, priority: 7,   pipelines: [ REASONING, CODING ] }

