<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Gateway Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-color: #0f1115; --bg-surface: #15181e; --bg-surface-hover: #1e222a;
            --text-main: #e2e8f0; --text-muted: #94a3b8; --border-color: #2e3340;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --brand-primary: #3b82f6; --brand-success: #10b981; --brand-warning: #f59e0b; --brand-danger: #ef4444;
        }
        :root[data-theme="light"] {
            --bg-color: #f8fafc; --bg-surface: #ffffff; --bg-surface-hover: #f1f5f9;
            --text-main: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --brand-primary: #2563eb; --brand-success: #059669; --brand-warning: #d97706; --brand-danger: #dc2626;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s, color 0.3s; margin: 0; padding: 0; min-height: 100vh; }
        .font-monospace { font-family: 'JetBrains Mono', monospace; }
        .card { background-color: var(--bg-surface); border: 1px solid var(--border-color); box-shadow: var(--card-shadow); transition: background-color 0.3s, border-color 0.3s; }
        .card-hover:hover { background-color: var(--bg-surface-hover); }
        .border-bottom { border-bottom: 1px solid var(--border-color) !important; }
        .nav-tabs { border-bottom: 1px solid var(--border-color); }
        .nav-tabs .nav-link { color: var(--text-muted); border: none; padding: 1rem 1.5rem; font-weight: 500; }
        .nav-tabs .nav-link.active { color: var(--text-main); background-color: transparent; border-bottom: 2px solid var(--brand-primary); }
        .nav-tabs .nav-link:hover:not(.active) { color: var(--text-main); border-bottom: 2px solid var(--border-color); }
        .table { color: var(--text-main); margin-bottom: 0; }
        .table th { background-color: transparent; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; padding: 1rem; }
        .table td { border-bottom: 1px solid var(--border-color); vertical-align: middle; background-color: transparent; }
        .table tbody tr:hover td { background-color: rgba(255, 255, 255, 0.03); }
        :root[data-theme="light"] .table tbody tr:hover td { background-color: rgba(0, 0, 0, 0.02); }
        .badge { padding: 0.4em 0.6em; font-weight: 600; }
        .category-badge { font-size: 0.7rem; padding: 0.3em 0.6em; border-radius: 4px; font-weight: 600; letter-spacing: 0.5px; }
        .category-coding { background: rgba(193, 98, 253, 0.15); color: #c162fd; }
        .category-reasoning { background: rgba(77, 161, 255, 0.15); color: #4da1ff; }
        .category-vision { background: rgba(107, 203, 119, 0.15); color: #6bcb77; }
        :root[data-theme="light"] .category-coding { background: rgba(193, 98, 253, 0.1); color: #a855f7; }
        :root[data-theme="light"] .category-reasoning { background: rgba(77, 161, 255, 0.1); color: #3b82f6; }
        :root[data-theme="light"] .category-vision { background: rgba(107, 203, 119, 0.1); color: #059669; }
        .spinner-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .form-select, .form-control { background-color: var(--bg-surface); border-color: var(--border-color); color: var(--text-main); }
        .form-select:focus, .form-control:focus { background-color: var(--bg-surface); border-color: var(--brand-primary); color: var(--text-main); box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25); }
        .btn-outline-secondary { color: var(--text-muted); border-color: var(--border-color); }
        .btn-outline-secondary:hover { background-color: var(--bg-surface-hover); color: var(--text-main); border-color: var(--text-muted); }
        .chart-container { position: relative; height: 300px; width: 100%; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1050; display: flex; flex-direction: column; gap: 10px; }
        .custom-toast { background-color: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 16px; border-radius: 8px; box-shadow: var(--card-shadow); display: flex; align-items: center; gap: 12px; font-size: 0.9rem; font-weight: 500; transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .custom-toast.show { transform: translateX(0); }
        .custom-toast.success i { color: var(--brand-success); }
        .custom-toast.error i { color: var(--brand-danger); }
        .text-muted { color: var(--text-muted) !important; }
        
        .navbar-brand img { width: 32px; height: 32px; }
        .sortable { cursor: pointer; user-select: none; }
        .sortable:hover { color: var(--text-main); }
        .sort-icon { display: inline-block; width: 14px; text-align: center; opacity: 0.5; margin-left: 4px; }
        .sortable.active .sort-icon { opacity: 1; color: var(--brand-primary); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
